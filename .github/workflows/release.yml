name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to build, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - name: Version matches the tag
        run: |
          node -e "const fs = require('fs'); const tag = process.env.RELEASE_TAG.replace(/^v/, ''); const pkg = require('./package.json').version; const conf = require('./src-tauri/tauri.conf.json').version; const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = \"(.*)\"$/m)[1]; for (const [name, v] of [['package.json', pkg], ['tauri.conf.json', conf], ['Cargo.toml', cargo]]) { if (v !== tag) { console.error(name + ' ' + v + ' != tag ' + tag); process.exit(1); } }"
      - run: pnpm build
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Create the draft release once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
            exit 0
          fi
          notes="docs/notes/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "LanTransport $RELEASE_TAG" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "LanTransport $RELEASE_TAG" \
              --notes "See the assets below to download and install LanTransport for your platform."
          fi

  release:
    needs: [checks, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "LanTransport ${{ env.RELEASE_TAG }}"
          releaseBody: "See the assets below to download and install LanTransport for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      # Publishing with GITHUB_TOKEN does not start other workflows, so the
      # release: published event that runs Packaging would be swallowed. An App
      # token does trigger them.
      - name: Mint a GitHub App token
        id: app
        if: vars.TAP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.TAP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: welpher
          repositories: lantransport
      # Runs only when every platform built: a half-uploaded release stays a draft.
      # The notes are applied here as well because tauri-action rewrites the body
      # while attaching assets.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/notes/${RELEASE_TAG}.md"
          args=(--draft=false --latest)
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${args[@]}"
