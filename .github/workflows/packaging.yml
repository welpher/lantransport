name: Packaging

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
      TAP_APP_PRIVATE_KEY: ${{ secrets.TAP_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rewrite manifests from the release assets
        run: node scripts/update-packaging.mjs "$TAG"
      - name: Commit manifest updates
        run: |
          if [ -z "$(git status --porcelain packaging)" ]; then
            echo "manifests already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging
          git commit -m "chore(packaging): sync manifests for $TAG"
          git push
      - name: Mint a token for the tap repository
        id: tap
        if: env.TAP_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.TAP_APP_ID }}
          private-key: ${{ env.TAP_APP_PRIVATE_KEY }}
          owner: welpher
          repositories: homebrew-tap
      - name: Update the Homebrew tap
        if: steps.tap.outputs.token != ''
        env:
          TAP_TOKEN: ${{ steps.tap.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/welpher/homebrew-tap.git" /tmp/tap
          cp packaging/homebrew/lantransport.rb /tmp/tap/Casks/lantransport.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lantransport.rb
          git diff --cached --quiet && { echo "tap already up to date"; exit 0; }
          git commit -m "lantransport ${TAG#v}"
          git push
