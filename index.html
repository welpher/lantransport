<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LanTransport</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <img class="logo" src="/icon.png" alt="" draggable="false" />
          <div>
            <h1>LanTransport</h1>
            <p id="tagline" class="tagline"></p>
          </div>
        </div>
        <div class="header-side">
          <span id="status" class="pill"><span class="dot"></span><span id="status-text"></span></span>
          <select id="locale" aria-label="Language"></select>
        </div>
      </header>

      <main class="stack">
        <div id="error" class="error" hidden></div>

        <section id="setup-card" class="card">
          <div class="section-head folders-head">
            <h2 id="folders-label"></h2>
            <span class="hint" id="folders-hint"></span>
            <button id="add-folder" class="btn small" type="button"></button>
          </div>
          <div id="folders" class="folders"></div>
          <div class="grid2">
            <label class="field">
              <span id="port-label"></span>
              <input id="port" type="number" min="1" max="65535" inputmode="numeric" />
            </label>
            <label class="check tall">
              <input id="lan" type="checkbox" />
              <span id="lan-label"></span>
            </label>
          </div>
          <div class="field">
            <label for="password" id="password-label"></label>
            <input id="password" type="password" autocomplete="new-password" />
            <div class="field-foot">
              <small id="password-hint" class="hint"></small>
              <label class="check compact">
                <input id="remember" type="checkbox" />
                <span id="remember-label"></span>
              </label>
            </div>
          </div>
          <button id="primary" class="primary"></button>
        </section>

        <section id="running-card" class="card" hidden>
          <div class="running-head">
            <div class="running-title">
              <span class="hint" id="sharing-label"></span>
              <h2 id="sharing-folder"></h2>
            </div>
            <span class="pill on"><span class="dot"></span><span id="live-label"></span></span>
          </div>
          <ul id="urls" class="urls"></ul>
          <div class="actions">
            <button id="qr-toggle" class="btn"></button>
            <button id="open" class="btn"></button>
          </div>
          <div id="qr-wrap" class="qr" hidden><img id="qr" alt="QR code" draggable="false" /></div>
          <div id="upload-share" class="upload-share" hidden>
            <span class="key-label" id="share-key-label"></span>
            <code id="share-key" class="key"></code>
            <button id="copy-share-key" class="btn"></button>
            <button id="share-upload-link" class="btn ghost"></button>
          </div>
          <button id="stop" class="primary stop"></button>
        </section>

        <section id="upload-card" class="card">
          <label class="check">
            <input id="allow-uploads" type="checkbox" />
            <span id="allow-uploads-label"></span>
          </label>
          <div id="upload-settings" class="upload-settings" hidden>
            <div class="key-row">
              <span class="key-label" id="upload-key-label"></span>
              <code id="upload-key" class="key"></code>
              <button id="copy-key" class="btn"></button>
              <button id="regen-key" class="btn ghost"></button>
              <label class="inline-field">
                <span id="max-upload-label"></span>
                <input id="max-upload" type="number" min="1" max="1048576" inputmode="numeric" />
              </label>
            </div>
            <p class="hint" id="upload-hint"></p>
          </div>
        </section>

        <section class="card prefs">
          <label class="check"><input id="auto-start" type="checkbox" /><span id="auto-start-label"></span></label>
          <label class="check"><input id="tray" type="checkbox" /><span id="tray-label"></span></label>
        </section>
      </main>

      <footer class="footer">
        <span id="security"></span>
        <span class="footer-right">
          <a id="sponsor" class="footlink">♥ Sponsor</a>
          <span id="version" class="muted"></span>
        </span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
